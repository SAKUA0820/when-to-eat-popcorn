<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>シーンとしたシーンは待っトレー！</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
      html, body { height: 100%; }
      body { background: #0b0d12; }
      #status { max-width: 420px; font-size: .7rem; }
      .file-input { width: 230px; }
      .turn-duration-slider { width: 140px; }
      .app-main { min-height: 0; }

      .drop-zone { transition: border-color .15s, box-shadow .15s; }
      .app-main.drag-over .drop-zone,
      .app-main.drag-over .video-stage {
        border-color: #ffc107 !important;
        box-shadow: 0 0 0 .25rem rgba(255, 193, 7, .25) !important;
      }

      .video-stage {
        position: relative;
        width: min(1280px, calc(100vw - 2rem), calc((100dvh - 110px) * 1.7778));
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #000;
      }

      .video-stage video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .video-control-button {
        width: 42px;
        height: 42px;
        font-size: 20px;
        line-height: 1;
        backdrop-filter: blur(8px);
      }

      .sound-overlay {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        padding-top: 37px;
        pointer-events: none;
        background: rgba(0, 0, 0, .68);
      }

      #loudness-graph {
        width: 100%;
        height: 72px;
        display: block;
      }

      .result-panel {
        z-index: 2;
        width: min(330px, calc(100% - 2rem));
        max-height: 42%;
        backdrop-filter: blur(8px);
      }

      #output {
        font-family: inherit;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      @media (max-width: 1199px) {
        #status { max-width: calc(100vw - 80px); }
        .video-stage { width: min(1280px, calc(100vw - 2rem), calc((100dvh - 150px) * 1.7778)); }
      }
    </style>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script
      src="https://unpkg.com/obniz@3.0.0/obniz.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
  </head>
  <body class="vh-100 d-flex flex-column overflow-hidden text-white">
    <!-- <div id="obniz-debug"></div> -->

    <!-- ファイル入力と操作ボタンをまとめたトップバー -->
    <header class="navbar navbar-dark bg-black border-bottom flex-shrink-0 p-2">
      <div class="container-fluid d-flex flex-column flex-xl-row align-items-stretch align-items-xl-center gap-2">
        <div class="d-flex align-items-center gap-2 flex-shrink-0">
          <span class="fs-3" aria-hidden="true">🍿</span>
          <div class="overflow-hidden">
            <h1 class="h5 fw-bold mb-0">シーンとしたシーンは待っトレー！</h1>
            <p id="status" class="text-secondary text-truncate mb-0" aria-live="polite">動画ファイルを選択してください（MP4推奨）</p>
          </div>
        </div>

        <div class="d-flex gap-2 flex-nowrap overflow-auto ms-xl-auto" aria-label="動画操作">
          <div class="d-flex align-items-center gap-2 flex-shrink-0">
            <label for="turnDurationSlider" class="small text-white-50 text-nowrap">回転時間 <output id="turnDurationValue" class="text-white">1.5秒</output></label>
            <input id="turnDurationSlider" class="form-range turn-duration-slider m-0" type="range" min="1000" max="2000" step="100" value="1500" aria-label="トレーの回転時間" aria-valuetext="1.5秒">
          </div>
          <button id="analyzeButton" class="btn btn-danger btn-sm flex-shrink-0 d-none" disabled>もう一度解析</button>
          <button id="topButton" class="btn btn-outline-light btn-sm flex-shrink-0">動画を変える</button>
        </div>
      </div>
    </header>

    <main id="app-main" class="app-main flex-grow-1 d-flex align-items-center justify-content-center p-3 overflow-hidden">
      <div id="empty-state" class="drop-zone text-center text-secondary border border-secondary border-opacity-25 rounded-4 p-5 d-flex flex-column align-items-center">
        <span class="fs-1 d-block mb-2" aria-hidden="true">🎬</span>
        <strong class="text-white d-block mb-1">映画をセットしてください</strong>
        <span class="d-block">ここに動画ファイルをドラッグ＆ドロップ</span>
        <small>または下のボタンから選択できます</small>
        <input id="fileInput" class="form-control form-control-sm file-input mt-3" type="file" accept="audio/*,video/*" aria-label="動画を選ぶ">
      </div>

      <!-- 動画をアップしたら中央に表示する -->
      <div id="video-container" class="video-stage rounded-4 border border-secondary border-opacity-25 shadow-lg d-none">
        <video playsinline></video>

        <!-- 動画操作を左上にオーバーレイ -->
        <div class="position-absolute top-0 start-0 z-3 d-flex gap-2 m-3">
          <button id="playButton" class="video-control-button btn btn-dark bg-opacity-75 rounded-circle d-flex align-items-center justify-content-center" type="button" aria-label="再生" title="再生" disabled>
            <span id="playButtonIcon" aria-hidden="true">▶</span>
          </button>
          <button id="rewindButton" class="video-control-button btn btn-dark bg-opacity-75 rounded-circle d-flex align-items-center justify-content-center" type="button" aria-label="最初から" title="最初から" disabled>
            <span aria-hidden="true">↺</span>
          </button>
        </div>

        <!-- 解析中表示 -->
        <div id="analysis-loading" class="position-absolute top-50 start-50 translate-middle z-3 text-center bg-dark bg-opacity-75 rounded-3 p-3 d-none" aria-live="polite">
          <div class="spinner-border spinner-border-sm text-warning mb-2" role="status"></div>
          <div class="small">食べどきを解析中…</div>
        </div>

        <!-- 検出結果を動画上にコンパクトに表示 -->
        <div id="result" class="result-panel position-absolute top-0 end-0 m-3 p-3 rounded-3 bg-dark bg-opacity-75 overflow-auto d-none">
          <p class="small fw-bold text-warning mb-1">検出結果</p>
          <pre id="output" class="text-white mb-0"></pre>
        </div>

        <!-- 音量グラフを動画下部にオーバーレイ -->
        <div class="sound-overlay">
          <div class="position-absolute top-0 start-0 w-100 d-flex gap-3 px-3 py-2 small text-white">
            <span class="text-success">● 食べてOK</span>
            <span>● 我慢しよう...</span>
          </div>
          <canvas id="loudness-graph" width="1280" height="72"></canvas>
        </div>
      </div>
    </main>

  <script>
    const obniz = new Obniz("OBNIZ_ID_HERE");

    const fileInput             = document.getElementById('fileInput');
    const analyzeButton         = document.getElementById('analyzeButton');
    const playButton            = document.getElementById('playButton');
    const playButtonIcon        = document.getElementById('playButtonIcon');
    const rewindButton          = document.getElementById('rewindButton');
    const topButton             = document.getElementById('topButton');
    const turnDurationSlider    = document.getElementById('turnDurationSlider');
    const turnDurationValue     = document.getElementById('turnDurationValue');
    const statusEl              = document.getElementById('status');
    const outputEl              = document.getElementById('output');
    const videoEl               = document.querySelector('video');
    const resultEl              = document.getElementById('result');
    const analysisLoadingEl     = document.getElementById('analysis-loading');
    const videoContainerEl      = document.getElementById('video-container');
    const emptyStateEl          = document.getElementById('empty-state');
    const appMainEl             = document.getElementById('app-main');
    const graphCanvas           = document.getElementById('loudness-graph');

    let decodedBuffer = null;
    let selectedFile = null;
    let videoObjectUrl = null;
    let analysisVersion = 0;
    let trayTurnDurationMs = 1500;

    let turnTimings = [];   // トレーを回転するタイミングの配列

    // ===== パラメータ（ここをいじって調整する） =====
    const FRAME_SEC      = 0.2;   // 0.2秒ごとに音の大きさを測る
    const HOP_SEC        = 0.05;   // 0.05秒ずつずらしながら測る
    const SMOOTH_SEC     = 2.0;    // 2秒くらいでなめらかにする
    const RISE_DB_PER_S  = +1.0;   // これ以上の勢いで上がったら「うるさくなり始め」
    const FALL_DB_PER_S  = -1.0;   // これ以下の勢いで下がったら「静かになり始め」
    const MIN_GAP_SEC    = 6;    // イベント同士の最小間隔
    const LOUD_PREROLL_SEC    = 0.5;    // 音が大きくなってから何秒後に回転を始めるか
    const QUIET_PREROLL_SEC   = 2.0;    // 音が小さくなる何秒前に回転を始めるか

    // スライダー操作中は表示だけ更新し、離したときに回転時間へ反映する
    turnDurationSlider.addEventListener('input', () => {
      const durationText = `${(Number(turnDurationSlider.value) / 1000).toFixed(1)}秒`;
      turnDurationValue.textContent = durationText;
      turnDurationSlider.setAttribute('aria-valuetext', durationText);
    });

    turnDurationSlider.addEventListener('change', () => {
      trayTurnDurationMs = Number(turnDurationSlider.value);
    });

    // ファイルを選んだら自動で解析する
    fileInput.addEventListener('change', () => {
      selectVideoFile(fileInput.files?.[0]);
    });

    // トップバー以外を動画ファイルのドロップ領域にする
    let dragDepth = 0;

    document.addEventListener('dragover', event => event.preventDefault());
    document.addEventListener('drop', event => event.preventDefault());

    appMainEl.addEventListener('dragenter', event => {
      if (!Array.from(event.dataTransfer?.types || []).includes('Files')) return;
      event.preventDefault();
      dragDepth++;
      appMainEl.classList.add('drag-over');
    });

    appMainEl.addEventListener('dragover', event => {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'copy';
    });

    appMainEl.addEventListener('dragleave', () => {
      dragDepth--;
      if (dragDepth <= 0) {
        dragDepth = 0;
        appMainEl.classList.remove('drag-over');
      }
    });

    appMainEl.addEventListener('drop', event => {
      event.preventDefault();
      dragDepth = 0;
      appMainEl.classList.remove('drag-over');

      const file = event.dataTransfer?.files?.[0];
      if (!selectVideoFile(file)) return;

      // ファイル入力にもドロップしたファイル名を反映する
      try {
        const transfer = new DataTransfer();
        transfer.items.add(file);
        fileInput.files = transfer.files;
      } catch (e) {
        // FileListを設定できないブラウザでも、動画の読み込み自体は継続する
      }
    });

    function selectVideoFile(file) {
      // 進行中の古い解析結果を無効にする
      analysisVersion++;
      analysisLoadingEl.classList.add('d-none');

      if (!file) {
        selectedFile = null;
        analyzeButton.disabled = true;
        statusEl.textContent = '動画ファイルを選択してください（MP4推奨）';
        return false;
      }

      if (!file.type.startsWith('video/') && !file.type.startsWith('audio/')) {
        selectedFile = null;
        analyzeButton.disabled = true;
        statusEl.textContent = '動画または音声ファイルを選択してください。';
        return false;
      }

      selectedFile = file;
      analyzeButton.disabled = true;
      analyzeButton.classList.add('d-none');
      playButton.disabled = true;
      rewindButton.disabled = true;
      setPlayButtonState(false);
      statusEl.textContent = `${file.name} が選択されました。サイズ ${(file.size / 1024 / 1024).toFixed(1)} MB`;
      outputEl.textContent = '';
      decodedBuffer = null;
      turnTimings = [];

      videoEl.pause();
      videoContainerEl.classList.remove('d-none');
      analysisLoadingEl.classList.remove('d-none');
      resultEl.classList.add('d-none');
      emptyStateEl.classList.add('d-none');
      graph.setBars(null, null, []);
      graph.drawAt(0);

      const URL = window.URL || window.webkitURL;
      if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);
      videoObjectUrl = URL.createObjectURL(file);
      videoEl.src = videoObjectUrl;
      analyzeSelectedFile();
      return true;
    }

    // 自動解析に失敗した場合のみ、ボタンから再解析する
    analyzeButton.addEventListener('click', analyzeSelectedFile);

    async function analyzeSelectedFile() {
      const file = selectedFile;
      if (!file) return;

      const currentVersion = ++analysisVersion;
      analyzeButton.disabled = true;
      analyzeButton.classList.add('d-none');
      playButton.disabled = true;
      rewindButton.disabled = true;
      analysisLoadingEl.classList.remove('d-none');
      resultEl.classList.add('d-none');
      statusEl.textContent = 'ファイルを読み込み中...';

      let audioContext = null;

      try {
        // AudioContext の初期化
        const AC = window.AudioContext || window.webkitAudioContext;
        audioContext = new AC();

        const arrayBuffer = await file.arrayBuffer();
        if (currentVersion !== analysisVersion) return;

        // 音声デコード
        const nextDecodedBuffer = await decodeAudio(arrayBuffer, audioContext);
        if (currentVersion !== analysisVersion) return;

        decodedBuffer = nextDecodedBuffer;
        const durationSec = nextDecodedBuffer.length / nextDecodedBuffer.sampleRate;
        statusEl.textContent =
          `音声をデコードしました: ${nextDecodedBuffer.sampleRate} Hz, ` +
          `${nextDecodedBuffer.numberOfChannels} ch, 長さ ${durationSec.toFixed(1)} 秒。解析中...`;

        // AudioContextのクローズ
        await audioContext.close();
        audioContext = null;

        // 解析本体
        const result = analyzeLoudness(nextDecodedBuffer);
        if (currentVersion !== analysisVersion) return;

        // 音量グラフの表示
        const bars = buildBarsFromSmoothDb(
          result.smoothDb,
          result.dt,
          durationSec,
          graphCanvas.width,
          -60,
          0
        );
        graph.setBars(bars, durationSec, result.events);
        graph.drawAt(0);

        // 食べ始め・食べ終わりの結果表示
        showEvents(result.events);
        turnTimings =  [...result.events];

        statusEl.textContent =
          '解析完了！';
        playButton.disabled = false;
        rewindButton.disabled = false;
        analysisLoadingEl.classList.add('d-none');
        videoContainerEl.classList.remove('d-none');
        resultEl.classList.remove('d-none');
        emptyStateEl.classList.add('d-none');
      } catch (e) {
        if (currentVersion !== analysisVersion) return;

        console.error(e);
        statusEl.textContent =
          '解析に失敗しました。「もう一度解析」を押してください。';
        analysisLoadingEl.classList.add('d-none');
        analyzeButton.textContent = 'もう一度解析';
        analyzeButton.disabled = false;
        analyzeButton.classList.remove('d-none');
      } finally {
        if (audioContext && audioContext.state !== 'closed') {
          try {
            await audioContext.close();
          } catch (e) {
            console.warn('AudioContextを終了できませんでした。', e);
          }
        }
      }
    }

    // 「再生 / 一時停止」を押したとき
    playButton.addEventListener('click', async () => {
      if(videoEl.paused){
        // 再生する
        videoEl.play();
      } else {
        // 一時停止する
        videoEl.pause();
      }
    });

    function setPlayButtonState(isPlaying) {
      const label = isPlaying ? '一時停止' : '再生';
      playButtonIcon.textContent = isPlaying ? 'Ⅱ' : '▶';
      playButton.setAttribute('aria-label', label);
      playButton.title = label;
    }
    
    // 「最初から」を押したとき
    rewindButton.addEventListener('click', async () => {
      // 再生を止めて、再生秒数を戻す
      videoEl.pause();
      videoEl.currentTime = 0;
      setPlayButtonState(false);
      // 過去のeventのリストをhaveUsedを戻す
      turnTimings.forEach(item => {
        item.haveUsed = false;
      });
    });

    // 「動画を変える」を押したとき
    topButton.addEventListener('click', async () => {
      // 進行中の解析結果を無効にする
      analysisVersion++;

      // 表示の初期化
      analyzeButton.disabled = true;
      analyzeButton.classList.add('d-none');
      playButton.disabled = true;
      rewindButton.disabled = true;
      statusEl.textContent = '動画ファイルを選択してください（MP4推奨）';
      outputEl.textContent = '';
      videoContainerEl.classList.add('d-none');
      resultEl.classList.add('d-none');
      analysisLoadingEl.classList.add('d-none');
      emptyStateEl.classList.remove('d-none');

      // 変数の初期化
      videoEl.pause();
      setPlayButtonState(false);
      fileInput.value = '';
      selectedFile = null;
      if (videoObjectUrl) {
        URL.revokeObjectURL(videoObjectUrl);
        videoObjectUrl = null;
      }
      videoEl.removeAttribute('src');
      videoEl.load();
      decodedBuffer = null;
      turnTimings = [];
    });

    // グラフ表示用 イベント追加等
    const graph = createDbGraph(graphCanvas, { dbMin: -60, dbMax: 0 });
    graph.bindCurrentTime(() => videoEl.currentTime);

    videoEl.addEventListener("play", () => {
      graph.start();
      setPlayButtonState(true);
    });
    videoEl.addEventListener("pause", () => {
      graph.stop();
      setPlayButtonState(false);
    });
    videoEl.addEventListener("ended", () => {
      graph.stop();
      setPlayButtonState(false);
    });
    videoEl.addEventListener("seeked", () => graph.drawAt(videoEl.currentTime));

    // obniz接続時のみ回転
    obniz.onconnect = async () => {
      // GND
      await obniz.io11.output(false);
      // PWM
      let pwm = obniz.getFreePwm();

      // 動画の再生時間が変化したとき
      videoEl.addEventListener('timeupdate', async() => {
        console.log('再生時間が変化しました');
        let currentTimeInteger = Math.round(videoEl.currentTime);

        // 音量変化がない動画の場合はreturn
        if (currentTimeInteger && !turnTimings?.length) {
          statusEl.textContent =
            '全体的に音量に変化がないか、解析が失敗している可能性があります。';
            return;
        }

        // 動画の時刻と回転タイミングが一致した時トレーを回転させる
        turnTimings.forEach(item => {
          if(item.time <= currentTimeInteger && !item.haveUsed){
            console.log(`turn ${item.type}`);
            turnTray(item, pwm);
            item.haveUsed = true;
          }
        });
      });
    }

    // AudioContext.decodeAudioData を Promise でラップ
    function decodeAudio(arrayBuffer, ctx) {
      return new Promise((resolve, reject) => {
        ctx.decodeAudioData(arrayBuffer, resolve, reject);
      });
    }

    // ====== 解析本体 =======
    function analyzeLoudness(buffer) {
      const sr = buffer.sampleRate;
      const channels = buffer.numberOfChannels;

      // 1. モノラル化（複数chの場合は平均）
      let samples;
      if (channels === 1) {
        samples = buffer.getChannelData(0);
      } else {
        samples = averageChannels(buffer);
      }

      // 2. フレームごとの RMS（音の大きさ）を計算
      // プラスマイナイスで相殺しないよう、2乗平均平方根を出す
      const frameSize = Math.max(1, Math.round(sr * FRAME_SEC)); //2乗平均平方根を出す時のサンプリング幅
      const hopSize   = Math.max(1, Math.round(sr * HOP_SEC)); //2乗平均平方根を出す時のずらし幅
      const rmsArray  = computeFrameRMS(samples, frameSize, hopSize);

      const dt = hopSize / sr; // 1フレームあたりの時間

      // 3. RMS を dB に変換（最大値を 0 dB とする）
      const dbArray = rmsToDb(rmsArray);
      console.log(rmsArray);

      // 4. 指数移動平均でなめらかにする
      const smoothDb = smoothExponential(dbArray, dt, SMOOTH_SEC);

      // 5. 勢い（dB/秒）を計算
      const diffDbPerSec = derivative(smoothDb, dt);

      // 6. 静か側20% / うるさい側80% でしきい値を決める
      const q20 = percentile(smoothDb, 0.25);
      const q80 = percentile(smoothDb, 0.75);
      const quietThreshold = q20 + 1.0; // 少し緩めにオフセット
      const loudThreshold  = q80 - 2.0;

      // 7. イベント検出（うるさくなり始め / 静かになり始め）
      const events = detectEvents(
        smoothDb,
        diffDbPerSec,
        dt,
        loudThreshold,
        quietThreshold,
        RISE_DB_PER_S,
        FALL_DB_PER_S,
        MIN_GAP_SEC,
        LOUD_PREROLL_SEC
      );

      return {
        dt,
        dbArray,
        smoothDb,
        diffDbPerSec,
        loudThreshold,
        quietThreshold,
        events,
      };
    }

    // ===== ユーティリティ関数たち =====

    // 複数チャンネルを平均してモノラルにする
    function averageChannels(buffer) {
      const channels = buffer.numberOfChannels;
      const length = buffer.length;
      const out = new Float32Array(length);

      for (let ch = 0; ch < channels; ch++) {
        const data = buffer.getChannelData(ch);
        for (let i = 0; i < length; i++) {
          out[i] += data[i] / channels;
        }
      }
      return out;
    }

    // フレームごとの RMS を計算
    function computeFrameRMS(samples, frameSize, hopSize) {
      const result = [];
      for (let start = 0; start + frameSize <= samples.length; start += hopSize) {
        let sumSq = 0;
        for (let i = start; i < start + frameSize; i++) {
          const v = samples[i];
          sumSq += v * v;
        }
        const rms = Math.sqrt(sumSq / frameSize);
        result.push(rms);
      }
      return result;
    }

    // RMS 配列を dB に変換（最大値を 0 dB に正規化）
    function rmsToDb(rmsArray) {
      const EPS = 1e-12;
      let maxRms = 0;

      // RMSの最大値を探す
      for (const r of rmsArray) {
        if (r > maxRms) {
          maxRms = r;
        }
      }
      // 0を避けるために小さい値を足す
      const ref = maxRms + EPS;
      // 各要素をRMS→dBに変換
      return rmsArray.map(r => 20 * Math.log10((r + EPS) / ref));
    }

    // 指数移動平均でなめらかにする
    function smoothExponential(values, dt, smoothSeconds) {
      const alpha = Math.exp(-dt / smoothSeconds); // 0.0〜1.0
      const out = new Array(values.length);
      out[0] = values[0];
      for (let i = 1; i < values.length; i++) {
        out[i] = alpha * out[i - 1] + (1 - alpha) * values[i];
      }
      return out;
    }

    // 1次微分（隣との差分）で dB/秒 を近似
    function derivative(values, dt) {
      const out = new Array(values.length);
      out[0] = 0;
      for (let i = 1; i < values.length; i++) {
        out[i] = (values[i] - values[i - 1]) / dt;
      }
      return out;
    }

    // 単純なパーセンタイル
    function percentile(values, p) {
      const sorted = [...values].sort((a, b) => a - b);
      const idx = (sorted.length - 1) * p;
      const lo = Math.floor(idx);
      const hi = Math.ceil(idx);
      if (lo === hi) return sorted[lo];
      return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
    }

    // イベント検出
    function detectEvents(
      smoothDb,
      diffDbPerSec,
      dt,
      loudThreshold,
      quietThreshold,
      riseThreshold,
      fallThreshold,
      minGapSec,
      prerollSec
    ) {
      const events = [];
      let lastEventTime = -Infinity;

      // 最初の状態（静かな場面か、うるさい場面か）をざっくり決める
      const mid = (loudThreshold + quietThreshold) / 2;
      let state = smoothDb[0] < mid ? 'quiet' : 'loud';

      for (let i = 0; i < smoothDb.length; i++) {
        const level = smoothDb[i];
        const slope = diffDbPerSec[i];
        const t = i * dt;

        // イベント同士が近すぎるときはスキップ
        if (t - lastEventTime < minGapSec) continue;

        if (state === 'quiet') {
          // 静かな状態から、うるさくなり始めたか？
          if (level >= loudThreshold && slope >= riseThreshold) {
            const eventTime = Math.round(Math.max(0, t + LOUD_PREROLL_SEC));
            events.push({ time: eventTime, type: 'LOUD_START', haveUsed: false });
            state = 'loud';
            lastEventTime = t;
          }
        } else {
          // うるさい状態から、静かになり始めたか？
          if (level <= quietThreshold && slope <= fallThreshold) {
            const eventTime = Math.round(Math.max(0, t - QUIET_PREROLL_SEC));
            events.push({ time: eventTime, type: 'QUIET_START', haveUsed: false });
            state = 'quiet';
            lastEventTime = t;
          }
        }
      }

      return events;
    }

    // 検出結果を画面に表示
    function showEvents(events) {
      if (!events.length) {
        outputEl.textContent = 'イベントは検出されませんでした。パラメータを少し緩めると出てくるかもしれません。';
        return;
      }

      const lines = events.map((e, i) => {
        const label = e.type === 'LOUD_START'
          ? 'うるさくなり始め 食べてOK！'
          : '静かになり始め 食べるのストップ！';
        return `  ${e.time} 秒: ${label}`;
      });

      outputEl.textContent = lines.join('\n');
    }

    // トレーを回す
    async function turnTray(event, pwm){
      // 回転方向の設定
      if(event.type === 'LOUD_START'){
        // Direction
        obniz.io0.output(true);
      } else if(event.type === 'QUIET_START'){
        // Direction
        obniz.io0.output(false);
      }

      pwm.start({io: 1});
      pwm.freq(300);
      pwm.duty(20);

      await obniz.wait(trayTurnDurationMs);
      await pwm.end();
    }

    // グラフ表示用 音声配列変換
    // 動画の長さ/グラフの横幅 をしたときの1px分のY座標の位置を計算
    function buildBarsFromSmoothDb(smoothDb, dtSec, durationSec, width, dbMin, dbMax) {
      const out = new Float32Array(width);
      const secPerPx = durationSec / width;

      for (let x = 0; x < width; x++) {
        const t0 = x * secPerPx;
        const t1 = (x + 1) * secPerPx;

        const i0 = Math.max(0, Math.floor(t0 / dtSec));
        const i1 = Math.min(smoothDb.length - 1, Math.ceil(t1 / dtSec));

        // 1px分の範囲内の最大値を取る(うるさくなり始めを目立たせたい)
        let m = dbMin;
        for (let i = i0; i <= i1; i++) {
          m = Math.max(m, smoothDb[i]);
        }
        if (m > dbMax) m = dbMax;

        out[x] = m;
      }

      return out;
    }

    // グラフ表示
    function createDbGraph(canvas, {
      dbMin = -60,
      dbMax = 0,
      bg = "transparent",
      line = "red",
      quietBarFill = "rgba(255,255,255,0.35)",
      loudBarFill  = "rgba(120,255,160,0.35)",
    } = {}) {
      const ctx = canvas.getContext("2d");

      // うるさいとき(=ポップコーン食べられる)のグラフの色と、そうでないときのグラフの色の定義
      const Section = {
        QUIET: { key: "QUIET", barFill: quietBarFill },
        LOUD:  { key: "LOUD",  barFill: loudBarFill  },
      };

      let bars = null;
      let durationSec = null;
      let eventsSorted = [];
      let loudRanges = [];
      let quietRanges = [];

      let rafId = null;
      let getCurrentTime = null;

      function dbToY(db, H) {
        const clamped = Math.max(dbMin, Math.min(dbMax, db));
        const p = (clamped - dbMin) / (dbMax - dbMin);
        return H * (1 - p);
      }

      function setBars(nextBars, nextDurationSec, nextEvents = []) {
        bars = nextBars;
        durationSec = nextDurationSec;

        eventsSorted = Array.isArray(nextEvents)
          ? [...nextEvents].sort((a, b) => a.time - b.time)
          : [];

        // 緑色になる各区間の開始・終了時刻を作る
        loudRanges = [];
        quietRanges = [];
        if (!durationSec) return;

        if (eventsSorted.length > 0) {
          let loudStart = eventsSorted[0].type === "QUIET_START" ? 0 : null;

          for (const event of eventsSorted) {
            const time = Math.max(0, Math.min(durationSec, event.time));

            if (event.type === "LOUD_START" && loudStart === null) {
              loudStart = time;
            } else if (event.type === "QUIET_START" && loudStart !== null) {
              if (time > loudStart) loudRanges.push({ start: loudStart, end: time });
              loudStart = null;
            }
          }

          if (loudStart !== null && durationSec > loudStart) {
            loudRanges.push({ start: loudStart, end: durationSec });
          }
        }

        // 緑色以外の範囲を白色の区間として作る
        let quietStart = 0;
        for (const range of loudRanges) {
          if (range.start > quietStart) {
            quietRanges.push({ start: quietStart, end: range.start });
          }
          quietStart = Math.max(quietStart, range.end);
        }
        if (quietStart < durationSec) {
          quietRanges.push({ start: quietStart, end: durationSec });
        }
      }

      function drawAt(currentTimeSec) {
        const W = canvas.width;
        const H = canvas.height;

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        if (bars && durationSec && durationSec > 0) {
          const secPerPx = durationSec / W;

          let section = (eventsSorted.length > 0 && eventsSorted[0].type === "QUIET_START")
            ? Section.LOUD
            : Section.QUIET;

          let idx = 0;

          for (let x = 0; x < bars.length; x++) {
            const tMid = (x + 0.5) * secPerPx;

            while (idx < eventsSorted.length && eventsSorted[idx].time <= tMid) {
              if (eventsSorted[idx].type === "LOUD_START") section = Section.LOUD;
              else if (eventsSorted[idx].type === "QUIET_START") section = Section.QUIET;
              idx++;
            }

            const y = dbToY(bars[x], H);
            ctx.fillStyle = section.barFill;
            ctx.fillRect(x, y, 1, H - y);
          }
        } else if (bars) {
          // durationが無い場合はデフォルト色で描く
          ctx.fillStyle = Section.QUIET.barFill;
          for (let x = 0; x < bars.length; x++) {
            const y = dbToY(bars[x], H);
            ctx.fillRect(x, y, 1, H - y);
          }
        }

        // 各区間の中央に、不透明な絵文字を1つ表示
        if (durationSec && durationSec > 0) {
          ctx.save();
          ctx.globalAlpha = 1;
          ctx.fillStyle = "#fff";
          ctx.font = '22px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
          ctx.textAlign = "center";
          ctx.textBaseline = "alphabetic";
          const markerY = H / 2 + 6;

          // 絵文字ごとの上下余白を補正し、見た目の中心を揃える
          function getBaselineOffset(emoji) {
            const metrics = ctx.measureText(emoji);
            const ascent = metrics.actualBoundingBoxAscent || 0;
            const descent = metrics.actualBoundingBoxDescent || 0;
            return (ascent - descent) / 2;
          }

          for (const range of quietRanges) {
            const centerTime = (range.start + range.end) / 2;
            const x = (centerTime / durationSec) * W;
            ctx.fillText("🤫", x, markerY + getBaselineOffset("🤫"));
          }

          for (const range of loudRanges) {
            const centerTime = (range.start + range.end) / 2;
            const x = (centerTime / durationSec) * W;
            ctx.save();
            ctx.translate(x, markerY);
            ctx.rotate(Math.PI / 6);
            ctx.fillText("🍿", 0, getBaselineOffset("🍿"));
            ctx.restore();
          }

          ctx.restore();
        }

        // 再生位置の赤線
        if (durationSec && durationSec > 0) {
          const ratio = currentTimeSec / durationSec;
          const x = ratio * W;

          ctx.strokeStyle = line;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
      }

      function start() {
        if (rafId) return;
        const loop = () => {
          if (getCurrentTime) drawAt(getCurrentTime());
          rafId = requestAnimationFrame(loop);
        };
        rafId = requestAnimationFrame(loop);
      }

      function stop() {
        if (!rafId) return;
        cancelAnimationFrame(rafId);
        rafId = null;
        if (getCurrentTime) drawAt(getCurrentTime());
      }

      function bindCurrentTime(getter) {
        getCurrentTime = getter;
      }

      return { setBars, drawAt, start, stop, bindCurrentTime };
    }

  </script>

  </body>
